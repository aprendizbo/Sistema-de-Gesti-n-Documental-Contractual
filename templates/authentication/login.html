<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Gestión Contractual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Fondo oscuro premium con gradientes sutiles */
        .bg-pattern {
            background-color: #0f172a; /* slate-900 */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
        }
    </style>
</head>
<body class="bg-pattern flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <!-- Luces decorativas de fondo -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full mix-blend-multiply filter blur-[100px] opacity-70"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-emerald-600/20 rounded-full mix-blend-multiply filter blur-[100px] opacity-70"></div>

    <!-- TARJETA DE LOGIN -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/20 overflow-hidden p-8 relative z-10">
        
        <!-- ENCABEZADO -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-50 to-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-5 text-2xl shadow-inner border border-blue-200/50">
                <i class="fa-solid fa-file-contract"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight">Gestión Contractual</h2>
            <p class="text-sm text-slate-500 mt-2 font-medium">Ingrese sus credenciales para acceder</p>
        </div>

        <!-- MENSAJES DE ERROR -->
        {% if messages %}
            <div class="space-y-3 mb-6">
            {% for message in messages %}
                <div class="p-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-700 text-sm font-bold flex items-center gap-3 shadow-xs">
                    <i class="fa-solid fa-triangle-exclamation text-rose-500 text-lg"></i>
                    {{ message }}
                </div>
            {% endfor %}
            </div>
        {% endif %}

        <!-- FORMULARIO -->
        <form method="POST" action="{% url 'authentication:login' %}" class="space-y-5">
            {% csrf_token %}
            
            <!-- USUARIO -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <input type="text" name="username" required placeholder="Ej: admin"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white transition-all outline-none placeholder:text-slate-400 font-medium">
                </div>
            </div>

            <!-- CONTRASEÑA -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white transition-all outline-none placeholder:text-slate-400 font-medium">
                </div>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all duration-300 shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] hover:-translate-y-0.5 flex items-center justify-center gap-2">
                Ingresar al Sistema <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

    </div>

</body>
</html>
