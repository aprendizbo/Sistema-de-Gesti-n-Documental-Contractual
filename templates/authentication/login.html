<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Gestión Contractual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif, system-ui; }
    </style>
</head>
<body class="bg-[#f5f3e8] flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <!-- Luces decorativas de fondo (Adaptadas a los colores de la marca) -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#0f4d7d]/10 rounded-full filter blur-[100px] opacity-70"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[#2f7d70]/10 rounded-full filter blur-[100px] opacity-70"></div>

    <!-- TARJETA DE LOGIN -->
    <div class="w-full max-w-md bg-white rounded-[16px] shadow-[0_8px_30px_rgba(30,42,48,0.08)] border border-[#e7e7e2] overflow-hidden p-8 relative z-10">
        
        <!-- ENCABEZADO -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#e8f0f6] text-[#0f4d7d] rounded-[12px] flex items-center justify-center mx-auto mb-5 text-[24px] shadow-inner border border-[#0f4d7d]/10">
                <i class="fa-solid fa-file-contract"></i>
            </div>
            <h2 class="text-[24px] font-extrabold text-[#20262b] tracking-tight">Gestión Contractual</h2>
            <p class="text-[13px] text-[#737b80] mt-2 font-medium">Ingrese sus credenciales para acceder</p>
        </div>

        <!-- MENSAJES DE ERROR -->
        {% if messages %}
            <div class="space-y-3 mb-6">
            {% for message in messages %}
                <div class="p-4 rounded-[8px] bg-[#f7e7e9] border border-[#f0cdd1] text-[#9f2431] text-[13px] font-bold flex items-center gap-3 shadow-sm">
                    <i class="fa-solid fa-triangle-exclamation text-[#9f2431] text-[16px]"></i>
                    {{ message }}
                </div>
            {% endfor %}
            </div>
        {% endif %}

        <!-- FORMULARIO -->
        <form method="POST" action="{% url 'authentication:login' %}" class="space-y-5">
            {% csrf_token %}
            
            <!-- USUARIO -->
            <div>
                <label class="block text-[13px] font-bold text-[#293137] mb-2">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#737b80]">
                        <i class="fa-solid fa-user text-[13px]"></i>
                    </div>
                    <input type="text" name="username" required placeholder="Ej: admin"
                           class="w-full pl-11 pr-4 py-3 bg-[#f5f3e8] border border-[#e7e7e2] text-[#20262b] text-[13px] rounded-[8px] focus:ring-2 focus:ring-[#0f4d7d]/20 focus:border-[#0f4d7d] focus:bg-white transition-all outline-none placeholder:text-[#a0aab2] font-medium">
                </div>
            </div>

            <!-- CONTRASEÑA -->
            <div>
                <label class="block text-[13px] font-bold text-[#293137] mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#737b80]">
                        <i class="fa-solid fa-lock text-[13px]"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full pl-11 pr-4 py-3 bg-[#f5f3e8] border border-[#e7e7e2] text-[#20262b] text-[13px] rounded-[8px] focus:ring-2 focus:ring-[#0f4d7d]/20 focus:border-[#0f4d7d] focus:bg-white transition-all outline-none placeholder:text-[#a0aab2] font-medium">
                </div>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="w-full mt-2 bg-[#0f4d7d] hover:bg-[#0c416b] text-white font-bold py-3.5 rounded-[8px] transition-all duration-300 shadow-[0_4px_14px_rgba(15,77,125,0.30)] hover:shadow-[0_6px_20px_rgba(15,77,125,0.20)] hover:-translate-y-0.5 flex items-center justify-center gap-2 text-[14px]">
                Ingresar al Sistema <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

    </div>

</body>
</html>
