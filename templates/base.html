<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CLM Corporativo{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex">

    <!-- Sidebar (Menú Fijo) -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="p-5 text-xl font-bold tracking-wider border-b border-slate-800 flex items-center gap-3">
            <i class="fa-solid fa-file-contract text-blue-500"></i> CLM Pro
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="/" class="block px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium">
                <i class="fa-solid fa-house mr-2"></i> Dashboard
            </a>
            <!-- URL ACTUALIZADA AQUÍ -->
            <a href="{% url 'contracts:lista' %}" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-folder-open mr-2"></i> Contratos
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <form action="{% url 'authentication:logout' %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="w-full text-left px-4 py-2 rounded-lg text-red-400 hover:bg-slate-800 transition">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        
        <!-- Header -->
        <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8">
            <h1 class="text-xl font-bold text-slate-800">
                {% block header_title %}Panel Principal{% endblock %}
            </h1>
            <span class="text-sm font-semibold text-slate-600">Bienvenido, {{ request.user.username }}</span>
        </header>

        <!-- Contenido Dinámico (Aquí se inyectan las demás vistas) -->
        <div class="p-8">
            {% block content %}
            {% endblock content %}
        </div>
        
    </main>

</body>
</html>
